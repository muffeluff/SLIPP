name: Brainz monthly charts pilot
on:
  workflow_dispatch:
  push:
    branches: [underground-pilot]
    paths: [.github/workflows/brainz-charts-pilot.yml]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/brainz_charts_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brainz-charts-results
          path: brainz-charts-results.json
          if-no-files-found: error
