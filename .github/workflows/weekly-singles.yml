name: Weekly singles
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 5'
    - cron: '0 14 * * 6,0,1'
  push:
    branches: [main]
    paths: [.github/workflows/weekly-singles.yml]
permissions:
  contents: write
concurrency:
  group: weekly-singles
  cancel-in-progress: false
jobs:
  singles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - run: python scripts/weekly_singles.py
      - run: |
          git config user.name "SLIPP singles bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edition.json singles-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly singles"
            git pull --rebase origin main
            git push
          fi
