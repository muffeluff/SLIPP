name: Editorial collection
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
  push:
    branches: [main]
    paths: [.github/workflows/editorial.yml]
permissions:
  contents: write
concurrency:
  group: editorial-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install feedparser requests beautifulsoup4
      - run: python scripts/production_editorial.py
      - run: |
          git config user.name "SLIPP editorial bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial
          if ! git diff --cached --quiet; then
            git commit -m "Collect editorial articles"
            git pull --rebase -X theirs origin main
            git push
          fi
