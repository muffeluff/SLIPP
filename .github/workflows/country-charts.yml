name: Country charts
on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * *'
  push:
    branches: [main]
    paths: [.github/workflows/country-charts.yml]
permissions:
  contents: write
concurrency:
  group: country-charts
  cancel-in-progress: false
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,concurrent.futures
          from pathlib import Path
          from datetime import datetime,timezone
          codes=re.search(r"const countries='([^']+)'",Path('index.html').read_text()).group(1).split()
          folder=Path('charts');folder.mkdir(exist_ok=True)
          def fetch(c):
              try:
                  url='https://rss.applemarketingtools.com/api/v2/'+c.lower()+'/music/most-played/100/songs.json'
                  with urllib.request.urlopen(url,timeout=20) as r: f=json.load(r)['feed']
                  rows=[dict(rank=i+1,title=x['name'],artist=x['artistName'],artwork=x.get('artworkUrl100','')) for i,x in enumerate(f['results'])]
                  if not rows: raise ValueError('Empty chart')
                  (folder/(c+'.json')).write_text(json.dumps(dict(date=f.get('updated','')[:10],source='Apple Music',entries=rows),ensure_ascii=False))
                  return c,dict(count=len(rows),status='ok')
              except Exception as e:
                  return c,dict(status='stale' if (folder/(c+'.json')).exists() else 'unavailable',error=str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: status=dict(pool.map(fetch,codes))
          (folder/'status.json').write_text(json.dumps(dict(updated=datetime.now(timezone.utc).isoformat(),countries=status),indent=2))
          PY
      - run: |
          git config user.name "SLIPP chart bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh country charts"
            git pull --rebase origin main
            git push
          fi
