name: SLIPP album covers
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
  push:
    branches: [main]
    paths: [edition.json, genres.json, scripts/fill_covers.py, .github/workflows/covers.yml]
permissions:
  contents: write
concurrency:
  group: slipp-covers
  cancel-in-progress: true
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Find verified artwork
        run: python3 scripts/fill_covers.py
      - name: Publish artwork URLs
        run: |
          git config user.name "SLIPP artwork bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edition.json genres.json
          if ! git diff --cached --quiet; then
            git commit -m "Fill verified album covers"
            git pull --rebase origin main
            git push
          fi
