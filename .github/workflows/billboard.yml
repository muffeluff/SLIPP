name: Billboard Hot 100
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 2,5'
  push:
    branches: [main]
    paths: [.github/workflows/billboard.yml]
permissions:
  contents: write
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install billboard.py
      - run: |
          python - <<'PY'
          import billboard,json,urllib.request
          from datetime import date
          try:
              c=billboard.ChartData('hot-100',timeout=30)
              entries=[dict(rank=x.rank,title=x.title,artist=x.artist,artwork=getattr(x,'image','') or '') for x in c]
              chart_date=c.date
              assert len(entries)==100
          except Exception as e:
              print('Primary source failed:',e)
              with urllib.request.urlopen('https://raw.githubusercontent.com/mhollingshead/billboard-hot-100/main/recent.json',timeout=30) as response:
                  data=json.load(response)
              chart_date=data['date']
              entries=[dict(rank=x['this_week'],title=x['song'],artist=x['artist'],artwork='') for x in data['data']]
          assert 0 <= (date.today()-date.fromisoformat(chart_date)).days <= 14 or -7 <= (date.today()-date.fromisoformat(chart_date)).days < 0
          assert len(entries)==100 and [x['rank'] for x in entries]==list(range(1,101))
          with open('billboard.json','w') as f: json.dump(dict(date=chart_date,entries=entries),f,ensure_ascii=False,indent=2)
          PY
      - run: |
          git config user.name "SLIPP chart bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Billboard Hot 100"
            git pull --rebase origin main
            git push
          fi
