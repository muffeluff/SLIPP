name: SLIPP full rehearsal
on:
  push:
    branches: [slipp-rehearsal]
    paths: ['.github/workflows/full-rehearsal.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rehearsal:
    if: github.ref == 'refs/heads/slipp-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Oslo
      SLIPP_RELEASE_DATE: '2026-11-20'
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 feedparser
      - name: Fetch fresh albums and editorial feeds
        run: |
          python scripts/rehearsal_album_feeds.py
          python scripts/rehearsal_editorial.py
      - name: Select albums and archive previous edition
        run: python scripts/rehearsal_albums.py
      - name: Select fresh singles
        run: python scripts/weekly_singles.py
      - name: Validate and match reviews
        run: python scripts/rehearsal_validate.py
      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-diagnostics
          path: |
            singles-audit.json
            album-feed-audit.json
            edition.json
            genres.json
      - name: Publish only to test branch
        run: |
          test "$(git branch --show-current)" = slipp-rehearsal
          git config user.name "SLIPP rehearsal"
          git config user.email "actions@users.noreply.github.com"
          git add edition.json genres.json archive/ editorial/ album-feed-audit.json album-popularity.json singles-audit.json
          git commit -m "Publish validated rehearsal edition"
          git push origin HEAD:slipp-rehearsal
      - name: Verify published test commit
        run: |
          git fetch origin slipp-rehearsal
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

