name: Friday edition staging
on:
  schedule:
    - cron: '17 * * * 5'
    - cron: '17 22,23 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: friday-edition-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v4
      - name: Check Oslo schedule
        id: gate
        run: |
          if [ "$(date +%u)" = "5" ]; then
            test "$(date +%u)" = 5
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "SLIPP_RELEASE_DATE=$(date +%F)" >> "$GITHUB_ENV"
          fi
      - if: steps.gate.outputs.go == 'true'
        run: |
          pip install requests beautifulsoup4 feedparser
          if python -c 'import json,os; e=json.load(open("staging/edition.json")); a=json.load(open("staging/singles-audit.json")); assert e["date"]==a["targetDate"]==os.environ["SLIPP_RELEASE_DATE"]; assert a["selected"]==5'; then
            exit 0
          fi
          if python -c 'import json,os; assert json.load(open("staging/edition.json"))["date"]==os.environ["SLIPP_RELEASE_DATE"]'; then
            cp staging/edition.json staging/genres.json .
          else
            python scripts/production_album_feeds.py
            python scripts/production_editorial.py || echo 'Optional editorial collection failed; continuing'
            python scripts/production_albums.py
          fi
          python scripts/production_singles.py
          if test -f staging/singles-audit.json && python -c 'import json,os; a=json.load(open("staging/singles-audit.json")); b=json.load(open("singles-audit.json")); assert a["targetDate"]==os.environ["SLIPP_RELEASE_DATE"] and a["selected"]>b["selected"]'; then
            exit 0
          fi
          python scripts/production_validate.py
          mkdir -p staging
          cp edition.json genres.json singles-audit.json staging/
          cp editorial/album-reviews.json staging/
          git config user.name "SLIPP staging"
          git config user.email "actions@users.noreply.github.com"
          git add staging/
          git diff --cached --quiet || git commit -m "Stage verified Friday edition"
          git push origin HEAD:main
