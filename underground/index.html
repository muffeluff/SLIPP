</style><main><header><h1>SLIPP.</h1><small>INDEPENDENT MUSIC<br>DISCOVERY MAGAZINE</small></header><nav>Ukens slipp　 <strong>Utforsk</strong>　 Topp 100　 Følger</nav><hr><small style="color:#f5ff00">UTFORSK / 01</small><h2>Underground.</h2><p style="color:#aaa">Beyond the charts.</p><div id="genres" class="tabs"></div><hr style="border-color:#f5ff00"><div class="top"><small id="period"></small><button id="fav">★ Lagret</button></div><h2 id="heading" style="font-size:26px;margin-top:15px"></h2><div id="formats" class="tabs"></div><div class="top"><small id="count"></small><select id="sort" aria-label="Sortering"><option value="popular">Mest populære</option><option value="new">Nyeste først</option></select></div><div id="tracks"></div><p id="notice"></p></main><script>
const demo=new URLSearchParams(location.search).get('demo')==='1',genres=['Alle','UK Garage','Jungle','Drum & Bass','Breakbeat','Techno','House','Ambient','Experimental'],formats=['Alle','Single','EP','Album','Remiks'];let genre='Alle',format='Alle',only=false,rows=[],saved=new Set();const key='slipp-underground-favorites-'+(demo?'demo':'live');try{saved=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}const $=id=>document.getElementById(id);function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function tabs(id,values,current,change){$(id).replaceChildren(...values.map(v=>{let b=el('button',v,v===current?'active':'');b.onclick=()=>{change(v);render()};return b}))}function render(){tabs('genres',genres,genre,v=>genre=v);tabs('formats',formats,format,v=>format=v);$('heading').textContent=(genre==='Alle'?'Ukens utgivelser':genre)+'.';$('fav').textContent='★ Lagret ('+saved.size+')';$('fav').className=only?'active':'';let list=rows.filter(x=>(genre==='Alle'||x.genre===genre)&&(format==='Alle'||x.format===format)&&(!only||saved.has(x.id)));list.sort((a,b)=>$('sort').value==='new'?b.date.localeCompare(a.date):(b.score||0)-(a.score||0));$('count').textContent=list.length+' UTGIVELSER';$('tracks').replaceChildren();if(!list.length)$('tracks').append(el('p',only?'Ingen lagrede utgivelser i dette utvalget.':'Ingen godkjente utgivelser i dette utvalget ennå.'));for(const [i,x] of list.entries()){let row=el('div',undefined,'track'),cover=el('div',undefined,'cover'),info=el('div',undefined,'info');if(demo){let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 100 100');for(let j=0;j<8;j++){let c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',50);c.setAttribute('cy',50);c.setAttribute('r',5+j*6);c.setAttribute('fill','none');c.setAttribute('stroke',['#d4dd48','#bb704a','#65888d','#d1b8a0'][i%4]);c.setAttribute('stroke-width',j%2?1:3);svg.append(c)}cover.append(svg)}else{cover.textContent='♪'}info.append(el('small',String(i+1).padStart(2,'0')+' / '+x.genre.toUpperCase()),el('h3',x.title),el('div',x.artist,'artist'),el('small',x.format+' · '+x.label+' · '+x.date));let b=el('button',saved.has(x.id)?'★':'☆','star '+(saved.has(x.id)?'active':''));b.setAttribute('aria-label','Lagre '+x.title);b.onclick=()=>{saved.has(x.id)?saved.delete(x.id):saved.add(x.id);try{localStorage.setItem(key,JSON.stringify([...saved]))}catch{}render()};row.append(cover,info,b);$('tracks').append(row)}}$('fav').onclick=()=>{only=!only;render()};$('sort').onchange=render;$('period').textContent=demo?'19–25 NOV 2026 · DEMO':'PILOT';$('notice').textContent=demo?'DESIGNPROTOTYPE — Fiktive utgivelser, coverbilder og rangeringer.':'Ingen eksterne kilder er aktivert. Utgivelser vises først etter godkjent dataintegrasjon.';if(demo){const titles=['Night Transit','Subsurface','Signal Dub','Concrete Echo','Afterimage','Broken Sequence','Room 404','Soft Focus','Still Water','Unfolding'];rows=titles.map((title,i)=>({id:'demo-'+i,title,artist:['Pressure Unit','Low Circuit','Phase Archive','Moss Signal'][i%4],genre:genres[i<3?1:i-1],format:formats[1+i%4],label:'Demo label',date:'2026-11-'+(25-i%7),score:99-i*4}))}render();
