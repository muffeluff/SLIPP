<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLIPP. Admin</title><style>*{box-sizing:border-box}body{background:#f5f1e7;color:#191919;font:15px Arial;max-width:900px;margin:auto;padding:20px}h1{font:bold 65px Georgia;letter-spacing:-5px;margin:0}em{color:#c52b24;font-style:normal}h2{font: bold 25px Georgia}header{border-bottom:3px solid;padding-bottom:15px}section{border-bottom:1px solid #bbb;padding:12px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #d8d2c6;overflow-wrap:anywhere}button,input{font:inherit;padding:10px}button{background:#222;color:white;border:0}input{max-width:100%}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{border:1px solid #bcb5a7;padding:12px}.metric strong{display:block;font: bold 30px Georgia}.ok{color:#247344}.bad{color:#b32b24}small{color:#665e55}a{color:inherit}</style><header><h1>SLIPP<em>.</em></h1>Administrasjon · <a href="/">Til forsiden</a></header><form id="login"><p>Administrasjonsnøkkel</p><input id="key" type="password" required autocomplete="current-password"> <button>Åpne</button></form><main id="main"></main><script>const main=document.querySelector('main'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const table=(headers,rows)=>'<table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';document.querySelector('form').onsubmit=async e=>{e.preventDefault();main.textContent='Henter status…';try{const res=await fetch('/api/admin/status',{headers:{Authorization:'Bearer '+document.querySelector('#key').value},cache:'no-store'});if(!res.ok)throw Error(res.status===503?'Adminnøkkel er ikke konfigurert.':'Tilgang avvist eller status utilgjengelig.');const d=await res.json();document.querySelector('#key').value='';const a=d.audit?.sources||[],s=d.collection?.sources||[],v=d.verified?.releases||[],g=d.genres||{},ed=d.edition||{},pairs=[...(ed.mustListen?.albums||[]),...(ed.mustListen?.singles||[]),...(ed.sections||[]).flatMap(x=>x.items||[]),...Object.values(g).flatMap(x=>x.flatMap(y=>y.items||[]))],unique=[...new Map(pairs.map(p=>[p.slice(0,2).join('|'),p])).values()],charts=Object.values(d.charts?.countries||{});const metric=(n,x)=>'<div class="metric"><small>'+esc(n)+'</small><strong>'+esc(x)+'</strong></div>';main.innerHTML='<section><h2>Status</h2><div class="metrics">'+metric('RSS-kilder',a.filter(x=>x.status==='feed_available').length+'/'+a.length)+metric('Innsamlede artikler',d.collection?.total??'—')+metric('Kandidater',d.collection?.candidates??'—')+metric('Katalogtreff',d.verified?v.length:'—')+metric('Cover registrert',unique.filter(p=>p[4]).length+'/'+unique.length)+metric('Land med fersk liste',charts.filter(x=>x.status==='ok').length+'/'+charts.length)+'</div><p>Utgave: '+esc(ed.date||'—')+'</p></section><section><h2>Siste datakjøringer</h2>'+table(['Prosess','Oppdatert'],[['Kildetest',d.audit?.updated],['Artikkelinnhenting',d.collection?.updated],['Utgivelsesverifisering',d.verified?.updated],['Hitlister',d.charts?.updated]])+'<p><a href="https://github.com/muffeluff/SLIPP/actions">Åpne GitHub Actions for kjørelogger</a></p></section><section><h2>Sjangerdekning</h2>'+table(['Sjanger','Kilder med innhold','Anbefalinger'],Object.entries(g).map(([k,x])=>[k,x.filter(y=>y.items?.length).length+'/'+x.length,x.reduce((n,y)=>n+(y.items?.length||0),0)]))+'</section><section><h2>Redaksjoner</h2>'+table(['Kilde','RSS-status','Siste innhenting'],a.map(x=>[x.name,x.status,s.find(y=>y.id===x.id)?.status||'—']))+'</section><section><h2>Manglende cover</h2>'+table(['Artist','Utgivelse'],unique.filter(p=>!p[4]).map(p=>p.slice(0,2)))+'</section><section><h2>Utilgjengelige datafiler</h2>'+esc((d.errors||[]).join(', ')||'Ingen')+'</section>'}catch(e){main.textContent=e.message}};</script></html>
